[project]
name = "infaz-mcp"
version = "0.1.0"
description = "5275 sayılı Kanun'a göre ceza infaz tarihleri hesaplayan yerel MCP sunucusu (tahminî — resmî müddetname savcılıkça düzenlenir)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2",
    "pydantic>=2",
    "python-dateutil>=2.9",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infaz_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
